services:
  - type: web
    name: silverbyte-studio
    env: node
    # Schema sync runs at build, not at start: the free tier spins down after idle and
    # re-runs the start command on every wake, which would put a Neon round-trip in
    # front of every cold start.
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx prisma db seed && npm run build
    startCommand: npm run start
    envVars:
      # Next.js 16 requires Node >= 20.9.
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      # Only used by the seed when the database has no admin yet. Leave unset and the
      # seed prints a random one-time password to the build log instead.
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      # GitHub Releases storage. GITHUB_REPO is "owner/repo" and must be public so
      # release assets download straight from GitHub's CDN.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_RELEASE_PREFIX
        sync: false
      # Optional. Lets Quick Share send download links from the server; without them
      # the console falls back to the operator's own mail client.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
